[MODULE_PARAMETERS]
// SHB source generation only (GAP-GN-001): the upstream router implements SHB
// and GBC, but this adapter currently wires up SHB triggering/observation only.
// Every PICS below that defaults to true in LibItsGeoNetworking_Pics.ttcn is
// explicitly disabled unless it is implemented and verified end to end.
// Must match the actual IUT GN address baked into hil_sut.cpp's Sut::reset()
// (config.mib.itsGnLocalGnAddr.mid only; type-of-address/station-type/reserved
// stay at vanetza::geonet::Address's defaults -- see etsi_geonetworking_adapter.cpp's
// iut_gn_address()). f_acGetLongPosVector compares the adapter's AcGnResponse
// against this exact value, so this is not an arbitrary PICS choice.
LibItsGeoNetworking_Pics.PICS_GN_LOCAL_GN_ADDR := {
    typeOfAddress := e_initial,
    stationType := e_unknown,
    reserved := 0,
    mid := '020000000001'O
}
LibItsGeoNetworking_Pics.PICS_GN_SECURITY := false
LibItsGeoNetworking_Pics.PICS_IS_IUT_SECURED := false
// FDV_BAH/FDV_COH send deliberately malformed Basic/Common headers and expect
// the IUT to reject them; this adapter does not implement that negative path.
LibItsGeoNetworking_Pics.PICS_GN_BASIC_HEADER := false
LibItsGeoNetworking_Pics.PICS_GN_COMMON_HEADER := false
LibItsGeoNetworking_Pics.PICS_GN_GUC := false
LibItsGeoNetworking_Pics.PICS_GN_GUC_SRC := false
LibItsGeoNetworking_Pics.PICS_GN_GUC_DST := false
LibItsGeoNetworking_Pics.PICS_GN_GUC_FWD := false
LibItsGeoNetworking_Pics.PICS_GN_GBC := false
LibItsGeoNetworking_Pics.PICS_GN_GBC_SRC := false
LibItsGeoNetworking_Pics.PICS_GN_GBC_DST := false
LibItsGeoNetworking_Pics.PICS_GN_GBC_FWD := false
LibItsGeoNetworking_Pics.PICS_GN_GAC := false
LibItsGeoNetworking_Pics.PICS_GN_GAC_SRC := false
LibItsGeoNetworking_Pics.PICS_GN_GAC_DST := false
LibItsGeoNetworking_Pics.PICS_GN_GAC_FWD := false
LibItsGeoNetworking_Pics.PICS_GN_TSB := false
LibItsGeoNetworking_Pics.PICS_GN_TSB_SRC := false
LibItsGeoNetworking_Pics.PICS_GN_TSB_DST := false
LibItsGeoNetworking_Pics.PICS_GN_TSB_FWD := false
LibItsGeoNetworking_Pics.PICS_GN_BEACON_SRC := false
LibItsGeoNetworking_Pics.PICS_GN_BEACON_DST := false
LibItsGeoNetworking_Pics.PICS_GN_LS_REQ_SRC := false
LibItsGeoNetworking_Pics.PICS_GN_LS_REQ_RETRANSMISSION := false
LibItsGeoNetworking_Pics.PICS_GN_LS_REQ_DST := false
LibItsGeoNetworking_Pics.PICS_GN_LS_REP_DST := false
LibItsGeoNetworking_Pics.PICS_GN_LS_FWD := false
LibItsGeoNetworking_Pics.PICS_GN_DAD := false
LibItsGeoNetworking_Pics.PICS_GN_SHB_DST := false
LibItsCommon_Pixits.PX_GNSS_SCENARIO_SUPPORT := false

[LOGGING]
LogFile := "%e.%h-%r.%s"
FileMask := LOG_ALL
ConsoleMask := VERDICTOP | ERROR | WARNING | EXECUTOR

[EXECUTE]
ItsGeoNetworking_TestControl.control
